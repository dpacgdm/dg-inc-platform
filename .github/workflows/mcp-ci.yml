name: MCP Governance CI

on:
  push:
    paths:
      - 'mcp/dg-governance-mcp/**'
      - 'governance/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'mcp/dg-governance-mcp/**'
      - 'governance/**'
      - '.github/workflows/mcp-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/dg-governance-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
