services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dg
      POSTGRES_PASSWORD: dg
      POSTGRES_DB: dgvideo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg -d dgvideo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: uvicorn app.identity_service:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  video-metadata-service:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: uvicorn app.video_metadata_service:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  upload-api:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: uvicorn app.upload_api:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
      METADATA_URL: http://video-metadata-service:8000
    ports:
      - "8003:8000"
    depends_on:
      video-metadata-service:
        condition: service_started
      redis:
        condition: service_healthy

  feed-service:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: uvicorn app.feed_service:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  playback-api:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: uvicorn app.playback_api:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy

  transcoder-worker-sim:
    build:
      context: ../..
      dockerfile: services/video-platform/Dockerfile
    command: python -m app.transcoder_worker
    environment:
      POSTGRES_DSN: postgresql://dg:dg@postgres:5432/dgvideo
      REDIS_URL: redis://redis:6379/0
      METADATA_URL: http://video-metadata-service:8000
      PROCESSING_SECONDS: "2"
    depends_on:
      video-metadata-service:
        condition: service_started
      redis:
        condition: service_healthy
